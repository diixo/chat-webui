services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: llama-server
    command:
      - -m
      - /models/llama-68m-chat-v1.q8_0.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -c
      - "2048"
      - -ngl
      - "0"
    volumes:
      - ./Llama-68M-Chat-v1-GGUF:/models:ro
    ports:
      - "8080:8080"
    restart: unless-stopped
